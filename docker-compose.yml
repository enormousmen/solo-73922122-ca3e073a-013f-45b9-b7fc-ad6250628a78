services:
  jwt-verifier:
    build:
      context: .
      dockerfile: Dockerfile
    image: intranet-jwt-verifier:1.0.0
    container_name: jwt-verifier
    environment:
      # Trust anchors are fixed at start-up; tokens cannot override them.
      JWKS_URL: "http://mock-jwks:8090/.well-known/jwks.json"
      MOCK_JWKS_BASE: "http://mock-jwks:8090"
      JWT_EXPECTED_ISSUER: "https://login.intranet.example/realms/ops"
      JWT_EXPECTED_AUDIENCE: "intranet-console"
      JWKS_CACHE_TTL: "60"
      JWKS_REFRESH_MIN_INTERVAL: "5"
      JWKS_FETCH_TIMEOUT: "2"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mock-jwks:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/verify', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  mock-jwks:
    build:
      context: .
      dockerfile: Dockerfile
    image: intranet-jwt-verifier:1.0.0
    container_name: mock-jwks
    command: ["uvicorn", "app.mock_jwks:app", "--host", "0.0.0.0", "--port", "8090"]
    ports:
      # Exposed on loopback too, so the JWKS source can be inspected directly.
      - "127.0.0.1:8090:8090"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=4).status==200 else 1)"]
      interval: 10s
      timeout: 4s
      retries: 5
